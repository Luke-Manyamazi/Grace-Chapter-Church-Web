<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Performance: preconnect before stylesheet request -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo-navbar.png" />
    <link rel="apple-touch-icon" href="/images/logo-navbar.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary Meta -->
    <title>Grace Chapter Church — Revealing Christ to the World</title>
    <meta name="description" content="Grace Chapter Church is a Christ-centred family with campuses in Johannesburg, Cape Town, Harare, UK, Canada and Mozambique. We exist to reveal Christ to the world." />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grace Chapter Church" />
    <meta property="og:title" content="Grace Chapter Church — Revealing Christ to the World" />
    <meta property="og:description" content="A Christ-centred family with campuses across Africa and beyond. Revealing Christ to the world." />
    <meta property="og:image" content="/images/hero-home.jpg" />
    <meta property="og:url" content="https://gracechapterchurch.online" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grace Chapter Church" />
    <meta name="twitter:description" content="A Christ-centred family. Revealing Christ to the world." />
    <meta name="twitter:image" content="/images/hero-home.jpg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
